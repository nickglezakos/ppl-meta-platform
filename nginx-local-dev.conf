# Nginx Configuration for PPL Meta Platform - Local Development
# This configuration routes requests to locally running Python services

events {
    worker_connections 1024;
}

http {
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Upstream definitions for local Python services
    upstream ppl_meta_node_local {
        server localhost:8001;
    }

    upstream ppl_meta_media_local {
        server localhost:8000;
    }

    upstream ppl_meta_gateway_local {
        server localhost:8080;
    }

    upstream ppl_meta_orchestrator_local {
        server localhost:8002;
    }

    upstream ppl_meta_frontend_local {
        server localhost:3000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Main server configuration
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Enable CORS for local development
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        # Handle preflight requests
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            # Default route to frontend (Flutter Web)
            proxy_pass http://ppl_meta_frontend_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Support for WebSocket connections (if needed for hot reload)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API Gateway routes (main entry point)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://ppl_meta_gateway_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Direct routes to Node Service (User Management)
        location /api/v1/users/ {
            limit_req zone=api burst=15 nodelay;
            
            proxy_pass http://ppl_meta_node_local/api/v1/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://ppl_meta_node_local/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Direct routes to Media Service
        location /api/v1/media/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://ppl_meta_media_local/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # File upload settings
            client_max_body_size 100M;
            proxy_request_buffering off;
        }

        # Direct routes to Orchestrator Service
        location /api/v1/orchestrate/ {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://ppl_meta_orchestrator_local/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Health check endpoints (aggregate)
        location /health {
            access_log off;
            
            # You can customize this to check all services
            proxy_pass http://ppl_meta_gateway_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Individual health checks
        location /health/node {
            access_log off;
            proxy_pass http://ppl_meta_node_local/api/v1/health;
        }

        location /health/media {
            access_log off;
            proxy_pass http://ppl_meta_media_local/health;
        }

        location /health/gateway {
            access_log off;
            proxy_pass http://ppl_meta_gateway_local/health;
        }

        location /health/orchestrator {
            access_log off;
            proxy_pass http://ppl_meta_orchestrator_local/health;
        }

        # Static file serving (if you have a frontend)
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Admin interface (optional)
        location /admin/ {
            proxy_pass http://ppl_meta_gateway_local/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API documentation (optional)
        location /docs {
            proxy_pass http://ppl_meta_gateway_local/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://ppl_meta_gateway_local/redoc;
            proxy_set_header Host $host;
        }

        # Error pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # Metrics endpoint (if you have monitoring)
        location /metrics {
            proxy_pass http://ppl_meta_gateway_local/metrics;
            access_log off;
        }

        # Security: Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Optional: HTTPS server (if you want to test with SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #     
    #     ssl_certificate /path/to/your/cert.pem;
    #     ssl_certificate_key /path/to/your/key.pem;
    #     
    #     # Include all the same location blocks as above
    # }
}
