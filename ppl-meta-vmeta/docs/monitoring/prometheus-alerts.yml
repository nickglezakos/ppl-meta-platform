# ==========================================
# TESTING ALERTS
# ==========================================
#
# To test alert firing:
#
# 1. Simulate high error rate:
#    curl -X POST http://localhost:8008/api/test/simulate-errors?count=100
#
# 2. Exhaust worker pool:
#    for i in {1..20}; do
#      curl -X POST http://localhost:8008/api/v1/batch-processing/trigger &
#    done
#
# 3. Disconnect WebSocket:
#    # Stop Camera Service temporarily
#
# 4. Check alert status:
#    curl http://prometheus:9090/api/v1/alerts | jq '.data.alerts'
#
# 5. Verify Alertmanager received alerts:
#    curl http://alertmanager:9093/api/v1/alerts | jq '.'
