# ============================================================================
# Nginx Configuration for PPL Meta vmeta Service
# ============================================================================
#
# Production reverse proxy configuration
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/vmeta
#   2. Create symlink: ln -s /etc/nginx/sites-available/vmeta /etc/nginx/sites-enabled/
#   3. Test: nginx -t
#   4. Reload: systemctl reload nginx
#
# Version: 1.0.0
# Date: November 1, 2025
# ============================================================================

# Upstream definition for vmeta service
upstream vmeta_backend {
    # Primary instance
    server 127.0.0.1:8008 max_fails=3 fail_timeout=30s;
    
    # Optional: Add backup/failover instances
    # server 127.0.0.1:8009 backup;
    # server 127.0.0.1:8010 backup;
    
    # Load balancing method
    # least_conn;  # Use least connections (good for long-lived requests)
    # ip_hash;     # Session affinity based on IP
    
    # Keepalive connections
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=vmeta_general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=vmeta_api:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=vmeta_create:10m rate=10r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=vmeta_conn:10m;

# ============================================================================
# HTTPS Server (Production)
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vmeta.production.example.com;
    
    # SSL Certificate
    ssl_certificate /etc/ssl/certs/vmeta.crt;
    ssl_certificate_key /etc/ssl/private/vmeta.key;
    
    # SSL Configuration (modern, secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Request limits
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Logging
    access_log /var/log/nginx/vmeta.access.log combined;
    error_log /var/log/nginx/vmeta.error.log warn;
    
    # Connection limits
    limit_conn vmeta_conn 10;
    
    # ========================================================================
    # Health Check Endpoint (No Authentication)
    # ========================================================================
    location /health {
        # No rate limiting for health checks
        proxy_pass http://vmeta_backend/health;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts (short for health checks)
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Disable buffering for real-time response
        proxy_buffering off;
        
        # Access control (allow monitoring systems)
        # allow 10.0.0.0/8;  # Internal network
        # deny all;
    }
    
    # ========================================================================
    # Metrics Endpoint (Prometheus)
    # ========================================================================
    location /metrics {
        proxy_pass http://127.0.0.1:9090/metrics;
        
        # Headers
        proxy_set_header Host $host;
        
        # Access control (restrict to monitoring systems)
        allow 10.0.0.0/8;
        deny all;
    }
    
    # ========================================================================
    # MVR-People API Endpoints
    # ========================================================================
    
    # Create MVR (rate limited)
    location /api/v1/mvr-people/create {
        limit_req zone=vmeta_create burst=5 nodelay;
        
        proxy_pass http://vmeta_backend;
        include /etc/nginx/proxy_params.conf;
        
        # Longer timeout for ML processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # Batch create (heavily rate limited)
    location /api/v1/mvr-people/batch {
        limit_req zone=vmeta_create burst=2 nodelay;
        
        proxy_pass http://vmeta_backend;
        include /etc/nginx/proxy_params.conf;
        
        # Very long timeout for batch operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Search endpoints (moderate rate limiting)
    location ~ ^/api/v1/mvr-people/(search|similar) {
        limit_req zone=vmeta_api burst=20 nodelay;
        
        proxy_pass http://vmeta_backend;
        include /etc/nginx/proxy_params.conf;
        
        # Enable caching for search results
        proxy_cache vmeta_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$request_uri|$request_body";
        proxy_cache_methods GET POST;
    }
    
    # General MVR API endpoints
    location /api/v1/mvr-people {
        limit_req zone=vmeta_api burst=20 nodelay;
        
        proxy_pass http://vmeta_backend;
        include /etc/nginx/proxy_params.conf;
    }
    
    # ========================================================================
    # General API Endpoints
    # ========================================================================
    location /api/v1 {
        limit_req zone=vmeta_general burst=50 nodelay;
        
        proxy_pass http://vmeta_backend;
        include /etc/nginx/proxy_params.conf;
    }
    
    # ========================================================================
    # Root and Documentation
    # ========================================================================
    location / {
        proxy_pass http://vmeta_backend;
        include /etc/nginx/proxy_params.conf;
    }
}

# ============================================================================
# HTTP to HTTPS Redirect
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name vmeta.production.example.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ============================================================================
# Proxy Parameters (include file)
# ============================================================================
