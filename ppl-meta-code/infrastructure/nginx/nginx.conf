# Main nginx configuration for PPL Meta Infrastructure
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream definitions for microservices
    upstream ppl_gateway {
        server ppl-meta-gateway:8080;
        keepalive 32;
    }

    upstream ppl_user_management {
        server ppl-meta-node:8001;
        keepalive 32;
    }

    upstream ppl_media_service {
        server ppl-meta-media:8000;
        keepalive 32;
    }

    upstream ppl_orchestrator {
        server ppl-meta-orchestrator:8002;
        keepalive 32;
    }

    # Include service-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
