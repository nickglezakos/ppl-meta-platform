camera:
  buffer_size: 10
  device_id: 0
  format: mjpeg
  fps: 15
  resolution:
    height: 720
    width: 1280
device:
  id: null  # Auto-generated from hostname (edge-camera-{hostname})
  location: unknown
  name: Edge Camera
  type: edge
logging:
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
platform:
  api_key: null
  cameras_url: http://192.168.1.75/cameras
  discovery_url: http://192.168.1.75/discovery
  health_check_interval: 30
  max_reconnect_attempts: 10
  reconnect_interval: 5
server:
  host: 0.0.0.0
  port: 9001
stream:
  chunk_size: 4096
  encoding: mjpeg
  quality: 80
