camera:
  buffer_size: 10
  device_id: 0
  format: mjpeg
  fps: 30
  resolution:
    height: 720
    width: 1280
device:
  id: edge-camera-rpi5-001
  location: unknown
  name: Edge Camera RPi5
  type: edge
logging:
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
platform:
  api_key: null
  cameras_url: auto
  discovery_url: auto
  health_check_interval: 30
  max_reconnect_attempts: 10
  reconnect_interval: 5
vpn:
  enabled: false
  authority_url: https://vpn.eyenet-vision.com
  application_key: "${EYENET_APPLICATION_KEY}"
server:
  host: 0.0.0.0
  port: 9001
stream:
  chunk_size: 4096
  encoding: mjpeg
  quality: 80
