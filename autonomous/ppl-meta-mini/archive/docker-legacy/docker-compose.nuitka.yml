version: "3.8"

services:
  ppl-meta-mini-nuitka:
    build:
      context: .
      dockerfile: Dockerfile.nuitka
    image: ppl-meta-mini:nuitka-latest
    container_name: ppl-meta-mini-nuitka
    ports:
      - "8004:8004"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount temporary directories (optional, for persistence)
      - ./storage:/app/storage
      - ./temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ppl-network

networks:
  ppl-network:
    driver: bridge
