services:
  postgres:
    # pgvector required — matches codebase MVR/face migrations (VECTOR(512)).
    # Do not use plain postgres:*-alpine; CREATE EXTENSION vector will fail.
    image: pgvector/pgvector:pg15
    platform: linux/amd64
    container_name: ppl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: ppl-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  ppl-meta-node:
    image: ${REGISTRY}/ppl-meta-node:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      # Bind all interfaces so LAN phones can reach Node through the VM/host publish.
      - "0.0.0.0:${NODE_PORT}:8001"
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      AUTHORITY_URL: ${AUTHORITY_URL}
      AUTHORITY_SERVICE_URL: ${AUTHORITY_URL}
      AUTHORITY_SERVICE_ENABLED: "true"
      INSTALLATION_UUID: ${INSTALLATION_UUID}
      AUTHORITY_INSTALLATION_UUID: ${INSTALLATION_UUID}
      EYENET_INSTALLATION_UUID: ${INSTALLATION_UUID}
      APPLICATION_KEY: ${APPLICATION_KEY}
      AUTHORITY_APPLICATION_KEY: ${APPLICATION_KEY}
      EYENET_APPLICATION_KEY: ${APPLICATION_KEY}
      EYENET_VPN_NODE_TYPE: platform
      EYENET_HEADSCALE_URL: ${EYENET_HEADSCALE_URL:-https://vpn.eyenet-vision.com}
      EYENET_TS_SOCKET: /var/run/tailscale/tailscaled.sock
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      SERVICE_SECRET: ${SERVICE_SECRET:-ppl-meta-secret-key-change-in-production}
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
      PRESENCE_SERVICE_URL: http://ppl-meta-presence:8011
      # LAN/Tailscale IP phones use; required for TrustedHostMiddleware inside Docker.
      ADVERTISE_HOST: ${ADVERTISE_HOST:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    volumes:
      - ${EYENET_TS_SOCKET_HOST:-/var/run/tailscale/tailscaled.sock}:/var/run/tailscale/tailscaled.sock
      - tailscale_state:/var/lib/tailscale
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m

  ppl-meta-media:
    image: ${REGISTRY}/ppl-meta-media:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${MEDIA_PORT}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      USER_SERVICE_URL: http://ppl-meta-node:8001
      GATEWAY_SERVICE_URL: http://ppl-meta-gateway:8080
      SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-ppl-meta-internal-service-secret-key-change-in-production}
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
      # Instant-detection triggers subscribe via REDIS_HOST (defaults to localhost otherwise).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      # Alert/email/webhook actions call Communications (defaults to localhost:8009 otherwise).
      COMMUNICATIONS_SERVICE_URL: http://ppl-meta-communications:8009
      # ppl_match / vprofile_match (video-only presence grants) need VMeta + Node.
      VMETA_SERVICE_URL: http://ppl-meta-vmeta:8008
      NODE_SERVICE_URL: http://ppl-meta-node:8001
      PRESENCE_SERVICE_URL: http://ppl-meta-presence:8011
      VISION_SERVICE_URL: http://ppl-meta-vision:8003
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ppl-meta-node:
        condition: service_started
      ppl-meta-communications:
        condition: service_started
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m

  ppl-meta-gateway:
    image: ${REGISTRY}/ppl-meta-gateway:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      USER_SERVICE_URL: http://ppl-meta-node:8001
      MEDIA_SERVICE_URL: http://ppl-meta-media:8000
      ORCHESTRATOR_SERVICE_URL: http://ppl-meta-orchestrator:8002
      VISION_SERVICE_URL: http://ppl-meta-vision:8003
      CAMERAS_SERVICE_URL: http://ppl-meta-cameras:8005
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
      VMETA_SERVICE_URL: http://ppl-meta-vmeta:8008
      COMMUNICATIONS_SERVICE_URL: http://ppl-meta-communications:8009
      PRESENCE_SERVICE_URL: http://ppl-meta-presence:8011
      MODELS_SERVICE_URL: http://ppl-meta-models:8013
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      SERVICE_SECRET: ${SERVICE_SECRET:-ppl-meta-secret-key-change-in-production}
    depends_on:
      ppl-meta-node:
        condition: service_started
      ppl-meta-media:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  ppl-meta-orchestrator:
    image: ${REGISTRY}/ppl-meta-orchestrator:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${ORCHESTRATOR_PORT}:8002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MEDIA_SERVICE_URL: http://ppl-meta-media:8000
      VISION_SERVICE_URL: http://ppl-meta-vision:8003
      VMETA_SERVICE_URL: http://ppl-meta-vmeta:8008
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-ppl-meta-internal-service-secret-key-change-in-production}
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
    depends_on:
      postgres:
        condition: service_healthy
      ppl-meta-node:
        condition: service_started
      ppl-meta-media:
        condition: service_started
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m

  ppl-meta-discovery:
    image: ${REGISTRY}/ppl-meta-discovery:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      # Bind all interfaces so LAN phones can reach discovery through the
      # VM/WSL/host port publish (not only 127.0.0.1).
      - "0.0.0.0:${DISCOVERY_PORT}:8006"
    environment:
      # Host LAN or Tailscale IP that mobile clients should use. Without this,
      # discovery advertises Docker-bridge addresses (172.18.x) that phones
      # cannot route to.
      ADVERTISE_HOST: ${ADVERTISE_HOST:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

  ppl-meta-communications:
    image: ${REGISTRY}/ppl-meta-communications:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${COMMUNICATIONS_PORT}:8009"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  ppl-meta-cameras:
    image: ${REGISTRY}/ppl-meta-cameras:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${CAMERAS_PORT:-8005}:8005"
    environment:
      HOST: 0.0.0.0
      PORT: "8005"
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      STREAM_STATE_REDIS_HOST: redis
      STREAM_STATE_REDIS_PORT: "6379"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      MODELS_SERVICE_URL: http://ppl-meta-models:8013
      MEDIA_SERVICE_URL: http://ppl-meta-media:8000
      NODE_SERVICE_URL: http://ppl-meta-node:8001
      VISION_SERVICE_URL: http://ppl-meta-vision:8003
      ORCHESTRATOR_SERVICE_URL: http://ppl-meta-orchestrator:8002
      VMETA_SERVICE_URL: http://ppl-meta-vmeta:8008
      VMETA_URL: http://ppl-meta-vmeta:8008
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-ppl-meta-internal-service-secret-key-change-in-production}
      VMETA_AGE_GENDER_TIMEOUT: ${VMETA_AGE_GENDER_TIMEOUT:-45}
      VMETA_IDENTITY_TIMEOUT: ${VMETA_IDENTITY_TIMEOUT:-8}
      AUTHORITY_URL: ${AUTHORITY_URL}
      INSTALLATION_UUID: ${INSTALLATION_UUID}
      APPLICATION_KEY: ${APPLICATION_KEY}
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
    volumes:
      - cameras_recordings:/app/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m

  ppl-meta-presence:
    image: ${REGISTRY}/ppl-meta-presence:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${PRESENCE_PORT:-8011}:8011"
    environment:
      HOST: 0.0.0.0
      PRESENCE_SERVICE_PORT: "8011"
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GATEWAY_SERVICE_URL: http://ppl-meta-gateway:8080
      COMMUNICATIONS_SERVICE_URL: http://ppl-meta-communications:8009/api/v1
      NODE_SERVICE_URL: http://ppl-meta-node:8001/api/v1
      CAMERAS_SERVICE_URL: http://ppl-meta-cameras:8005
      MEDIA_SERVICE_URL: http://ppl-meta-media:8000
      PRESENCE_PREFERRED_CAMERA_TYPES: MOBILE,RTSP,EDGE
      SERVICE_SECRET: ${SERVICE_SECRET:-ppl-meta-secret-key-change-in-production}
      SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
      PEOPLE_USER_SYNC_ENABLED: "true"
      PEOPLE_USER_SYNC_INTERVAL_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      ppl-meta-cameras:
        condition: service_started
      ppl-meta-communications:
        condition: service_started
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  ppl-meta-models:
    image: ${REGISTRY}/ppl-meta-models:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${MODELS_PORT:-8013}:8013"
    environment:
      HOST: 0.0.0.0
      MODELS_SERVICE_PORT: "8013"
      ENVIRONMENT: production
      MODELS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_SERVICE_URL: http://ppl-meta-node:8001/api/v1
      VISION_SERVICE_URL: http://ppl-meta-vision:8003
      SERVICE_SECRET: ${SERVICE_SECRET:-ppl-meta-secret-key-change-in-production}
      MODELS_REQUIRE_LICENCE: "false"
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
    depends_on:
      postgres:
        condition: service_healthy
      ppl-meta-node:
        condition: service_started
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  ppl-meta-vision:
    image: ${REGISTRY}/ppl-meta-vision-protected:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${VISION_PORT}:8003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_DIR: /app/logs
      ORCHESTRATOR_URL: http://ppl-meta-orchestrator:8002
      MEDIA_SERVICE_URL: http://ppl-meta-media:8000
      GATEWAY_SERVICE_URL: http://ppl-meta-gateway:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-ppl-meta-internal-service-secret-key-change-in-production}
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
    depends_on:
      postgres:
        condition: service_healthy
      ppl-meta-orchestrator:
        condition: service_started
    restart: unless-stopped
    mem_limit: 2560m
    mem_reservation: 1536m

  ppl-meta-vmeta:
    image: ${REGISTRY}/ppl-meta-vmeta-protected:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${VMETA_PORT}:8008"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      # Must match Node JWT signing secret. Without this, vmeta defaults to a
      # different key, MVR calls 401 on video preview, and the frontend clears auth.
      SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ppl-meta-secret-key-change-in-production}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      MEDIA_SERVICE_URL: http://ppl-meta-media:8000
      ORCHESTRATOR_SERVICE_URL: http://ppl-meta-orchestrator:8002
      VISION_SERVICE_URL: http://ppl-meta-vision:8003
      NODE_SERVICE_URL: http://ppl-meta-node:8001
      GATEWAY_SERVICE_URL: http://ppl-meta-gateway:8080
      # Alias used by older VMeta code paths; must not default to localhost in-container.
      PPL_GATEWAY_URL: http://ppl-meta-gateway:8080
      CAMERAS_SERVICE_URL: http://ppl-meta-cameras:8005
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-ppl-meta-internal-service-secret-key-change-in-production}
      DISCOVERY_SERVICE_URL: http://ppl-meta-discovery:8006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 2g

  ppl-meta-frontend:
    image: ${REGISTRY}/ppl-meta-frontend:${RELEASE_TAG}
    platform: linux/amd64
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      ppl-meta-gateway:
        condition: service_started
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

volumes:
  postgres_data:
  redis_data:
  tailscale_state:
  media_data:
  cameras_recordings:
