events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Flutter entrypoints are NOT content-hashed. Never mark them immutable —
        # that pinned stale main.dart.js for a year after Stage 3 (logout-after-
        # /triggers looked "unfixed" on labs that had already pulled GHCR).
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }

        location = /main.dart.js {
            add_header Cache-Control "no-cache" always;
        }

        location = /flutter_bootstrap.js {
            add_header Cache-Control "no-cache" always;
        }

        location = /flutter_service_worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /version.json {
            add_header Cache-Control "no-cache" always;
        }

        location = /manifest.json {
            add_header Cache-Control "no-cache" always;
        }

        # Handle Flutter web routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-cache only fingerprinted / binary static assets (not app JS entrypoints)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /canvaskit/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API proxy (optional - if serving API through same domain)
        location /api/ {
            proxy_pass http://ppl-meta-gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
