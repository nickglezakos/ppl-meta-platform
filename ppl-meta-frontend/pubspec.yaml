name: ppl_meta_frontend
description: PPL Meta Platform - Flutter Frontend Microservice
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API Communication
  http: ^1.5.0
  dio: ^5.9.0
  web_socket_channel: ^2.4.0
  
  # State Management
  provider: ^6.0.5
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^16.1.0
  
  # UI Components
  material_design_icons_flutter: ^7.0.7296
  flutter_svg: ^2.0.8
  google_fonts: ^6.1.0
  
  # File & Image Handling
  file_picker: ^10.2.4
  image_picker: ^1.0.4
  
  # Video Playback
  video_player: ^2.8.1
  
  # Advanced UI Components
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.0
  fl_chart: ^1.0.0
  
  # Sharing
  share_plus: ^11.0.0
  
  # Storage & Caching
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # Authentication
  jwt_decoder: ^2.0.1
  
  # Forms & Validation
  formz: ^0.8.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  logger: ^2.6.1
  path_provider: ^2.1.1
  excel: ^4.0.3
  timeago: ^3.6.1
  
  # JSON serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  
  # Development
  cupertino_icons: ^1.0.6
  # google_fonts: ^6.3.0  # Temporarily disabled for offline development

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Quality
  flutter_lints: ^6.0.0
  very_good_analysis: ^9.0.0
  
  # Testing
  mockito: ^5.4.5
  
  # Code Generation
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  json_serializable: ^6.9.0
  freezed: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
