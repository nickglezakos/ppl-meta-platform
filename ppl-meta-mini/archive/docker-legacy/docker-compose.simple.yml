version: "3.8"

services:
  ppl-meta-mini-simple:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: ppl-meta-mini-simple
    ports:
      - "8004:8004"
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    volumes:
      - ./temp:/app/temp
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ppl-meta-network

networks:
  ppl-meta-network:
    driver: bridge
