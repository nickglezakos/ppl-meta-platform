# PPL Meta Platform - Production Deployment with Docker Secrets
# This compose file demonstrates proper secrets management for production

services:
  # PostgreSQL Database - Shared by all services
  postgres:
    image: postgres:15-alpine
    container_name: ppl-postgres
    environment:
      POSTGRES_DB: ppl_db
      POSTGRES_USER: nickadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_MULTIPLE_DATABASES: ppl_db,ppl_media_db,ppl_orchestrator_db,ppl_gateway_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ppl-internal
    restart: unless-stopped
    secrets:
      - database_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nickadmin -d ppl_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching and Session Storage with Password
  redis:
    image: redis:7-alpine
    container_name: ppl-redis
    command: redis-server --requirepass $$(cat /run/secrets/redis_password)
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ppl-internal
    restart: unless-stopped
    secrets:
      - redis_password
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "$$(cat /run/secrets/redis_password)",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # PPL Meta Gateway Service - API Router and Service Discovery
  ppl-meta-gateway:
    image: ppl-meta-gateway:latest
    container_name: ppl-meta-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=ppl-meta-gateway
      - SERVICE_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8080
      - DEBUG=false
      - USER_SERVICE_URL=http://ppl-meta-node:8001
      - MEDIA_SERVICE_URL=http://ppl-meta-media:8000
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_DISCOVERY_ENABLED=false
      - PROMETHEUS_ENABLED=false
      - RATE_LIMIT_ENABLED=true
    depends_on:
      - redis
    networks:
      - ppl-network
      - ppl-internal
    restart: unless-stopped
    secrets:
      - source: ppl-meta-gateway_secret_key
        target: secret_key
      - source: ppl-meta-gateway_jwt_secret
        target: jwt_secret
      - source: redis_password
        target: redis_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Management Service - Authentication and User Operations
  ppl-meta-node:
    image: ppl-meta-node:latest
    container_name: ppl-meta-node
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://nickadmin@postgres:5432/ppl_db
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=false
      - PPL_MEDIA_SERVICE_URL=http://ppl-meta-media:8000
      - PPL_GATEWAY_URL=http://ppl-meta-gateway:8080
    depends_on:
      - postgres
    volumes:
      - user-data:/app/data
    networks:
      - ppl-network
      - ppl-internal
    restart: unless-stopped
    secrets:
      - source: ppl-meta-node_secret_key
        target: secret_key
      - source: ppl-meta-node_jwt_secret
        target: jwt_secret
      - source: ppl-meta-node_reset_password_secret
        target: reset_password_secret
      - source: ppl-meta-node_service_secret
        target: service_secret
      - source: database_password
        target: database_password
      - source: mail_password
        target: mail_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Media Processing Service
  ppl-meta-media:
    image: ppl-meta-media:latest
    container_name: ppl-meta-media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nickadmin@postgres:5432/ppl_media_db
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - PPL_NODE_SERVICE_URL=http://ppl-meta-node:8001
      - PPL_GATEWAY_URL=http://ppl-meta-gateway:8080
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    volumes:
      - media-storage:/app/storage
    networks:
      - ppl-network
      - ppl-internal
    restart: unless-stopped
    secrets:
      - source: ppl-meta-media_secret_key
        target: secret_key
      - source: ppl-meta-media_jwt_secret
        target: jwt_secret
      - source: database_password
        target: database_password
      - source: redis_password
        target: redis_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Orchestrator Service
  ppl-meta-orchestrator:
    image: ppl-meta-orchestrator:latest
    container_name: ppl-meta-orchestrator
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://nickadmin@postgres:5432/ppl_orchestrator_db
      - HOST=0.0.0.0
      - PORT=8002
      - DEBUG=false
      - USER_SERVICE_URL=http://ppl-meta-node:8001
      - MEDIA_SERVICE_URL=http://ppl-meta-media:8000
      - GATEWAY_SERVICE_URL=http://ppl-meta-gateway:8080
    depends_on:
      - postgres
      - redis
    networks:
      - ppl-network
      - ppl-internal
    restart: unless-stopped
    secrets:
      - source: ppl-meta-orchestrator_secret_key
        target: secret_key
      - source: ppl-meta-orchestrator_jwt_secret
        target: jwt_secret
      - source: database_password
        target: database_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Docker Secrets Configuration
secrets:
  # Common secrets
  database_password:
    external: true
    name: common_database_password
  redis_password:
    external: true
    name: common_redis_password
  mail_password:
    external: true
    name: common_mail_password

  # Gateway secrets
  ppl-meta-gateway_secret_key:
    external: true
    name: ppl-meta-gateway_secret_key
  ppl-meta-gateway_jwt_secret:
    external: true
    name: ppl-meta-gateway_jwt_secret

  # Node service secrets
  ppl-meta-node_secret_key:
    external: true
    name: ppl-meta-node_secret_key
  ppl-meta-node_jwt_secret:
    external: true
    name: ppl-meta-node_jwt_secret
  ppl-meta-node_reset_password_secret:
    external: true
    name: ppl-meta-node_reset_password_secret
  ppl-meta-node_service_secret:
    external: true
    name: ppl-meta-node_service_secret

  # Media service secrets
  ppl-meta-media_secret_key:
    external: true
    name: ppl-meta-media_secret_key
  ppl-meta-media_jwt_secret:
    external: true
    name: ppl-meta-media_jwt_secret

  # Orchestrator secrets
  ppl-meta-orchestrator_secret_key:
    external: true
    name: ppl-meta-orchestrator_secret_key
  ppl-meta-orchestrator_jwt_secret:
    external: true
    name: ppl-meta-orchestrator_jwt_secret

volumes:
  postgres_data:
  redis_data:
  media-storage:
  user-data:

networks:
  # Public-facing network for external access
  ppl-network:
    driver: bridge
    external: false

  # Internal network for service-to-service communication
  ppl-internal:
    driver: bridge
    internal: false # Allow external access for development
