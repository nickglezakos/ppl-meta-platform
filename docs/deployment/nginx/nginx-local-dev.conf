# Nginx Configuration for PPL Meta Platform - Local Development
# This configuration routes requests to locally running Python services

pid /tmp/ppl-meta-nginx.pid;
error_log /tmp/ppl-meta-nginx-error.log notice;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/ppl-meta-nginx-access.log;

    # DISABLE ALL CACHING FOR DEVELOPMENT
    proxy_cache off;
    proxy_store off;
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Disable browser caching
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Upstream definitions for local Python services
    upstream ppl_meta_node_local {
        server localhost:8001;
    }

    upstream ppl_meta_media_local {
        server localhost:8000;
    }

    upstream ppl_meta_gateway_local {
        server localhost:8080;
    }

    upstream ppl_meta_orchestrator_local {
        server localhost:8002;
    }

    upstream ppl_meta_vision_local {
        server localhost:8003;
    }

    upstream ppl_meta_cameras_local {
        server localhost:8005;
    }

    upstream ppl_meta_discovery_local {
        server localhost:8006;
    }

    upstream ppl_meta_bootcore_local {
        server localhost:8007;
    }

    upstream ppl_meta_vmeta_local {
        server localhost:8008;
    }

    upstream ppl_meta_communications_local {
        server localhost:8009;
    }

    upstream ppl_meta_frontend_local {
        server localhost:3000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Main server configuration
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Enable CORS for local development
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        # Handle preflight requests
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            # Default route to frontend (Flutter Web)
            # DISABLE CACHING FOR DEVELOPMENT
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            proxy_pass http://ppl_meta_frontend_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Support for WebSocket connections (if needed for hot reload)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API Gateway routes (ALL API requests go through Gateway)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            # DISABLE CACHING FOR DEVELOPMENT
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            proxy_pass http://ppl_meta_gateway_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Vision Service direct routes
        location /vision/ {
            # DISABLE CACHING FOR DEVELOPMENT
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            proxy_pass http://ppl_meta_vision_local/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Cameras Service direct routes
        location /cameras/ {
            # DISABLE CACHING FOR DEVELOPMENT
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            proxy_pass http://ppl_meta_cameras_local/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # WebSocket support for edge camera connections
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Discovery Service routes
        location /discovery/ {
            # DISABLE CACHING FOR DEVELOPMENT
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            proxy_pass http://ppl_meta_discovery_local/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Media Service API routes (triggers, collections, signage)
        location /api/media/ {
            # DISABLE CACHING FOR DEVELOPMENT
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            # Remove /api/media prefix and pass to media service
            rewrite ^/api/media/(.*) /$1 break;
            proxy_pass http://ppl_meta_media_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Node Service API routes (authentication, users)
        location /api/node/ {
            limit_req zone=auth burst=10 nodelay;
            
            # DISABLE CACHING FOR DEVELOPMENT
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            # Remove /api/node prefix and pass to node service
            rewrite ^/api/node/(.*) /$1 break;
            proxy_pass http://ppl_meta_node_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Communications Service API routes
        location /api/communications/ {
            # DISABLE CACHING FOR DEVELOPMENT
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            # Remove /api/communications prefix and pass to communications service
            rewrite ^/api/communications/(.*) /$1 break;
            proxy_pass http://ppl_meta_communications_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoints (aggregate)
        location /health {
            access_log off;
            
            # You can customize this to check all services
            proxy_pass http://ppl_meta_gateway_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Individual health checks
        location = /health/node {
            access_log off;
            proxy_pass http://ppl_meta_node_local/api/v1/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/media {
            access_log off;
            proxy_pass http://ppl_meta_media_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/gateway {
            access_log off;
            proxy_pass http://ppl_meta_gateway_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/orchestrator {
            access_log off;
            proxy_pass http://ppl_meta_orchestrator_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/vision {
            access_log off;
            proxy_pass http://ppl_meta_vision_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/cameras {
            access_log off;
            proxy_pass http://ppl_meta_cameras_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/discovery {
            access_log off;
            proxy_pass http://ppl_meta_discovery_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/bootcore {
            access_log off;
            proxy_pass http://ppl_meta_bootcore_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/vmeta {
            access_log off;
            proxy_pass http://ppl_meta_vmeta_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health/communications {
            access_log off;
            proxy_pass http://ppl_meta_communications_local/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static file serving (if you have a frontend)
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Admin interface (optional)
        location /admin/ {
            proxy_pass http://ppl_meta_gateway_local/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API documentation (optional)
        location /docs {
            proxy_pass http://ppl_meta_gateway_local/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://ppl_meta_gateway_local/redoc;
            proxy_set_header Host $host;
        }

        # Error pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # Metrics endpoint (if you have monitoring)
        location /metrics {
            proxy_pass http://ppl_meta_gateway_local/metrics;
            access_log off;
        }

        # Security: Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Optional: HTTPS server (if you want to test with SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #     
    #     ssl_certificate /path/to/your/cert.pem;
    #     ssl_certificate_key /path/to/your/key.pem;
    #     
    #     # Include all the same location blocks as above
    # }
}
