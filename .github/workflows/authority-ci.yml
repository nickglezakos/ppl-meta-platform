name: Authority CI

on:
  pull_request:
    paths:
      - 'autonomous/ppl-meta-authority/**'
      - '.github/workflows/authority-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'autonomous/ppl-meta-authority/**'
      - '.github/workflows/authority-ci.yml'
  workflow_dispatch:

jobs:
  validate-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: authority_db
          POSTGRES_USER: authority_user
          POSTGRES_PASSWORD: authority_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authority_user -d authority_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AUTHORITY_DATABASE_URL: postgresql://authority_user:authority_password@localhost:5432/authority_db
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'

    defaults:
      run:
        working-directory: autonomous/ppl-meta-authority/src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install authority dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run authority validation suite
        run: |
          python validate_authority_auth_dashboard.py
          python validate_authority_invitations_assignments.py
          python validate_authority_reseller_scope.py
          python validate_authority_distributor_scope.py
          python validate_authority_admin_ui.py
          python validate_authority_admin_e2e_workflow.py
          python validate_authority_lifecycle.py
          python validate_authority_bootstrap_gate.py
          python validate_authority_activation_contract.py
