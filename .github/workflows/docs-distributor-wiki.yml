name: Docs Distributor Wiki

on:
  push:
    paths:
      - 'docs/wiki/distributors/**'
      - 'docs/wiki/SOFTWARE_REF.md'
      - 'scripts/validate_wiki_software_ref.py'
      - '.github/workflows/docs-distributor-wiki.yml'
  pull_request:
    paths:
      - 'docs/wiki/distributors/**'
      - 'docs/wiki/SOFTWARE_REF.md'
      - 'scripts/validate_wiki_software_ref.py'
      - '.github/workflows/docs-distributor-wiki.yml'
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate software_ref frontmatter
        run: python scripts/validate_wiki_software_ref.py docs/wiki/distributors

      - name: Package distributor wiki artifact
        run: |
          mkdir -p artifacts/distributor-wiki
          cp -R docs/wiki/distributors/. artifacts/distributor-wiki/
          cp docs/wiki/SOFTWARE_REF.md artifacts/distributor-wiki/
          printf '%s\n' "site=distributors" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/distributor-wiki/BUILD_INFO.txt

      - name: Upload distributor wiki artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyenet-distributor-wiki
          path: artifacts/distributor-wiki
          retention-days: 14
