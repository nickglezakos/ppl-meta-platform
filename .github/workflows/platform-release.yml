name: Platform Release

on:
  workflow_dispatch:
    inputs:
      platform_version:
        description: 'Platform version tag to publish. Defaults to VERSION file when omitted.'
        required: false
  push:
    tags:
      - 'platform-v*'

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve platform version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.platform_version }}" ]; then
            VERSION_VALUE='${{ github.event.inputs.platform_version }}'
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == platform-v* ]]; then
            VERSION_VALUE="${GITHUB_REF_NAME#platform-v}"
          else
            VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "Publishing platform version: $VERSION_VALUE"

  build-frontend-web:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: ppl-meta-frontend
        run: |
          flutter pub get
          flutter build web --release

      - name: Upload frontend web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: ppl-meta-frontend/build/web
          retention-days: 1

  publish-service:
    needs: [resolve-version, build-frontend-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: node
            context: ppl-meta-node
            file: ppl-meta-node/Dockerfile
            image: ppl-meta-node
          - key: media
            context: ppl-meta-media
            file: ppl-meta-media/Dockerfile
            image: ppl-meta-media
          - key: gateway
            context: ppl-meta-gateway
            file: ppl-meta-gateway/Dockerfile
            image: ppl-meta-gateway
          - key: orchestrator
            context: ppl-meta-orchestrator
            file: ppl-meta-orchestrator/Dockerfile
            image: ppl-meta-orchestrator
          - key: discovery
            context: ppl-meta-discovery
            file: ppl-meta-discovery/Dockerfile
            image: ppl-meta-discovery
          - key: communications
            context: ppl-meta-communications
            file: ppl-meta-communications/Dockerfile
            image: ppl-meta-communications
          - key: frontend
            context: ppl-meta-frontend
            file: ppl-meta-frontend/Dockerfile
            image: ppl-meta-frontend
            needs_frontend_web: true
          - key: vision
            context: ppl-meta-vision
            file: ppl-meta-vision/docker/Dockerfile.protected
            image: ppl-meta-vision-protected
          - key: vmeta
            context: ppl-meta-vmeta
            file: ppl-meta-vmeta/docker/Dockerfile.protected
            image: ppl-meta-vmeta-protected
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download frontend web artifacts
        if: matrix.needs_frontend_web
        uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: ppl-meta-frontend/build/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/nickglezakos/ppl-meta-platform/${{ matrix.image }}:${{ needs.resolve-version.outputs.version }}
            ghcr.io/nickglezakos/ppl-meta-platform/${{ matrix.image }}:${{ needs.resolve-version.outputs.version }}-${{ github.sha }}
